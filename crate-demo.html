<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crate drawer demo — Mkurugenzi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="crate.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#C2B280;font-family:'Inter',sans-serif;color:#5C4033}
  header{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;background:#C2B280;border-bottom:1px solid rgba(92,64,51,.25)}
  header strong{font-size:18px;font-weight:800}
  .cart-btn{background:none;border:0;padding:6px;width:36px;height:36px}
  .cart-btn img{width:100%;height:100%;object-fit:contain}
  main{padding:18px}
  h1{font-size:22px;margin:0 0 14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{background:#F6F1E4;border-radius:18px;padding:12px}
  .card .ph{height:110px;border-radius:60px 60px 12px 12px;background:#C2B280;display:grid;place-items:center;font-size:34px;font-weight:800}
  .card h2{font-size:14px;margin:10px 0 2px;color:#2E2019}
  .card p{margin:0 0 10px;font-size:13px;font-weight:600}
  .card button{width:100%;border:0;background:#5C4033;color:#F6F1E4;border-radius:999px;padding:10px;font:700 13px 'Inter',sans-serif}
  .hint{font-size:12.5px;margin-top:16px}
</style>
</head>
<body>
<header>
  <strong>Mkurugenzi</strong>
  <!-- your existing cart button: just add data-crate-open -->
  <button class="cart-btn" data-crate-open><img src="images/cart.png" alt="Crate"></button>
</header>
<main>
  <h1>Shop</h1>
  <div class="grid">
    <div class="card"><div class="ph">H</div><h2>Heritage Hoodie</h2><p>KES 2,800</p><button data-add data-id="hoodie" data-name="Heritage Hoodie" data-price="2800" data-tag="Unisex">Add to crate</button></div>
    <div class="card"><div class="ph">M</div><h2>Movement Tee</h2><p>KES 1,200</p><button data-add data-id="tee" data-name="Movement Tee" data-price="1200" data-tag="Gents">Add to crate</button></div>
    <div class="card"><div class="ph">S</div><h2>Savanna Dress</h2><p>KES 3,500</p><button data-add data-id="dress" data-name="Savanna Dress" data-price="3500" data-tag="Ladies">Add to crate</button></div>
    <div class="card"><div class="ph">C</div><h2>Classic Cap</h2><p>KES 900</p><button data-add data-id="cap" data-name="Classic Cap" data-price="900" data-tag="Unisex">Add to crate</button></div>
  </div>
  <p class="hint">Test codes: MKURU10, WELCOME500, FREESHIP</p>
</main>
<script src="crate.js"></script>
</body>
</html>
